<div id="rclone-editor" class="rclone-editor" data-api="{{ rclone_api }}" data-setup="{{ 'true' if rclone_setup else 'false' }}">
  <div data-rclone-overview><p class="text-muted">Loading destination…</p></div>
  <div id="rclone-workspace" class="modal-overlay rclone-editor" data-rclone-modal>
    <section class="modal-container rclone-workspace" role="dialog" aria-modal="true" aria-labelledby="rclone-editor-title">
      <header class="modal-header">
        <h2 id="rclone-editor-title" tabindex="-1"></h2>
        <span id="rclone-editor-context"></span>
        <button type="button" class="modal-close" data-action="close-editor" aria-label="Cancel editing"><i class="fas fa-xmark" aria-hidden="true"></i></button>
      </header>
      <div data-rclone-content></div>
    </section>
  </div>
</div>
