name: Python CI

permissions:
  contents: read

on:
  pull_request:
  push:
    branches: [main]

jobs:
  python-ci:
    name: Python CI (uv / Python 3.14)
    runs-on: ubuntu-latest
    container: ghcr.io/astral-sh/uv:python3.14-trixie

    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      # Browserless UI regressions are pytest tests that execute the shipped JS.
      # Keep Node available so they do not silently skip in the Python image.
      - name: Install JavaScript test runtime
        run: |
          apt-get update
          apt-get install -y --no-install-recommends nodejs

      - name: Run source checks
        run: bash check_ci.sh --check-format

      - name: Run security checks
        run: bash check_security.sh --no-sync
